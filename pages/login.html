<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Adi Shankara</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">

  <style>
    .premium-bg {
      background-color: #fcfbf9;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5b48d' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: 0 8px 32px rgba(87, 0, 0, 0.04);
    }

    .input-premium {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }
    
    .input-premium:focus {
      background: #ffffff;
      border-color: #791c12;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01), 0 0 0 3px rgba(121, 28, 18, 0.1);
      outline: none;
    }
  </style>
</head>
<body class="premium-bg text-on-surface min-h-screen flex items-center justify-center p-4 selection:bg-secondary/20 selection:text-primary">

  <div class="glass-panel w-full max-w-md p-8 md:p-10 rounded-3xl relative overflow-hidden shadow-xl animate-fade-in">
    <!-- Decorative Top Bar -->
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>
    
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20 mb-4 shadow-sm">
        <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
      </div>
      <h1 class="text-3xl font-headline-md text-primary font-bold tracking-tight">Kshethram Admin</h1>
      <p class="font-label-md text-xs uppercase tracking-[0.2em] text-secondary mt-2">Management Portal</p>
    </div>

    <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-800 p-4 rounded-xl font-body-md mb-6 flex items-start gap-3 text-sm">
      <span class="material-symbols-outlined text-[18px] text-red-500 mt-0.5">error</span>
      <span id="login-error-text">Authentication failed. Please check your credentials.</span>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block font-label-md text-xs uppercase tracking-wider text-primary mb-1.5 font-bold">Email Address</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-sandalwood pointer-events-none">
            <span class="material-symbols-outlined text-[18px]">mail</span>
          </span>
          <input type="email" id="email" required class="w-full input-premium pl-10 p-3.5 rounded-xl text-sm font-body-md" placeholder="admin@example.com">
        </div>
      </div>

      <div>
        <label class="block font-label-md text-xs uppercase tracking-wider text-primary mb-1.5 font-bold">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-sandalwood pointer-events-none">
            <span class="material-symbols-outlined text-[18px]">lock</span>
          </span>
          <input type="password" id="password" required class="w-full input-premium pl-10 p-3.5 rounded-xl text-sm font-body-md" placeholder="••••••••">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-primary to-primary-container hover:from-primary-container hover:to-primary text-white font-label-md text-sm uppercase tracking-widest py-4 px-6 rounded-xl transition-all duration-300 shadow-[0_8px_20px_rgba(87,0,0,0.25)] hover:shadow-[0_12px_25px_rgba(87,0,0,0.35)] hover:-translate-y-0.5 flex items-center justify-center gap-2 font-bold disabled:opacity-70 disabled:cursor-not-allowed">
          <span class="material-symbols-outlined text-[18px]">login</span> Sign In to Portal
        </button>
      </div>
    </form>

    <div class="mt-8 text-center">
      <a href="../index.html" class="inline-flex items-center gap-1 font-label-md text-xs uppercase tracking-wider text-secondary hover:text-primary transition-colors pb-0.5 border-b border-transparent hover:border-secondary">
        <span class="material-symbols-outlined text-[14px]">arrow_back</span> Return to Website
      </a>
    </div>
  </div>

  <script type="module" src="../assets/js/admin-auth.js"></script>
</body>
</html>
