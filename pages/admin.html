<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Adi Shankara</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
  
  <script type="module">
    import { db, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from '../assets/js/firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('add-announcement-form');
      const statusMessage = document.getElementById('status-message');
      const feedContainer = document.getElementById('feed-container');
      const formTitle = document.getElementById('form-title');
      const submitBtn = document.getElementById('submit-btn');
      const cancelEditBtn = document.getElementById('cancel-edit-btn');
      
      let currentEditId = null;

      // Realtime Feed
      const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
      
      onSnapshot(q, (snapshot) => {
        feedContainer.innerHTML = '';
        if (snapshot.empty) {
          feedContainer.innerHTML = '<p class="text-on-surface-variant font-body-md p-4 bg-surface-bright rounded border border-sandalwood/30">No announcements found. Add one on the left!</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          
          const card = document.createElement('div');
          card.className = "border border-sandalwood/30 bg-surface-bright p-5 rounded-xl flex flex-col gap-3 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group";
          
          card.innerHTML = `
            <div class="absolute top-0 left-0 w-1 h-full bg-secondary opacity-50"></div>
            <div class="flex justify-between items-start pl-2">
              <div>
                <span class="font-label-md text-[10px] tracking-[0.15em] text-secondary uppercase bg-secondary/10 px-2 py-1 rounded-md border border-secondary/20">${data.badge || 'Update'}</span>
                <h3 class="font-headline-md text-lg text-primary mt-2 leading-tight font-semibold">${data.title}</h3>
                <p class="font-body-md text-on-surface-variant text-sm mt-1 line-clamp-2">${data.description}</p>
                <p class="font-label-md text-xs text-on-surface-variant/70 mt-2 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">calendar_today</span> ${data.fullDate || 'No date set'}</p>
              </div>
            </div>
            <div class="flex gap-2 mt-2 pt-3 border-t border-sandalwood/20 pl-2">
              <button class="edit-btn font-label-md text-xs uppercase tracking-wider text-secondary hover:text-primary transition-colors flex items-center gap-1" data-id="${id}">
                <span class="material-symbols-outlined text-[14px]">edit</span> Edit
              </button>
              <button class="delete-btn font-label-md text-xs uppercase tracking-wider text-red-600 hover:text-red-800 transition-colors flex items-center gap-1 ml-4" data-id="${id}">
                <span class="material-symbols-outlined text-[14px]">delete</span> Delete
              </button>
            </div>
          `;
          
          feedContainer.appendChild(card);
          
          // Attach listeners
          card.querySelector('.edit-btn').addEventListener('click', () => {
            currentEditId = id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('badge').value = data.badge || '';
            document.getElementById('dateMonth').value = data.dateMonth || '';
            document.getElementById('dateDay').value = data.dateDay || '';
            document.getElementById('description').value = data.description || '';
            document.getElementById('fullDate').value = data.fullDate || '';
            document.getElementById('when').value = data.when || '';
            document.getElementById('where').value = data.where || '';
            document.getElementById('link').value = data.link || '';
            
            formTitle.textContent = "Edit Announcement";
            submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">update</span> Update Announcement`;
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          
          card.querySelector('.delete-btn').addEventListener('click', async () => {
            if (confirm("Are you sure you want to delete this announcement? This action cannot be undone.")) {
              try {
                await deleteDoc(doc(db, "announcements", id));
                if (currentEditId === id) resetForm();
              } catch (error) {
                alert("Error deleting: " + error.message);
              }
            }
          });
        });
      });

      function resetForm() {
        currentEditId = null;
        form.reset();
        formTitle.textContent = "Add New Announcement";
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">publish</span> Publish Announcement`;
        cancelEditBtn.classList.add('hidden');
      }

      cancelEditBtn.addEventListener('click', resetForm);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const announcementData = {
          title: document.getElementById('title').value,
          badge: document.getElementById('badge').value || 'Update',
          dateMonth: document.getElementById('dateMonth').value || 'N/A',
          dateDay: document.getElementById('dateDay').value || 'N/A',
          description: document.getElementById('description').value,
          fullDate: document.getElementById('fullDate').value || '',
          when: document.getElementById('when').value || '',
          where: document.getElementById('where').value || '',
          link: document.getElementById('link').value || '',
        };

        try {
          if (currentEditId) {
            // Update
            await updateDoc(doc(db, "announcements", currentEditId), announcementData);
            statusMessage.innerHTML = `<div class="bg-green-100/50 border border-green-600/30 text-green-800 p-3 rounded font-label-md mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">check_circle</span> Announcement updated successfully!</div>`;
          } else {
            // Create
            announcementData.createdAt = serverTimestamp();
            await addDoc(collection(db, "announcements"), announcementData);
            statusMessage.innerHTML = `<div class="bg-green-100/50 border border-green-600/30 text-green-800 p-3 rounded font-label-md mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">check_circle</span> Announcement created successfully!</div>`;
          }
          resetForm();
          
          // Clear status after 4 seconds
          setTimeout(() => { statusMessage.innerHTML = ''; }, 4000);
        } catch (error) {
          statusMessage.innerHTML = `<div class="bg-red-100/50 border border-red-600/30 text-red-800 p-3 rounded font-label-md mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">error</span> Error: ${error.message}</div>`;
        }
      });
    });
  </script>
</head>
<body class="bg-surface text-on-surface min-h-screen">
  
  <header class="border-b border-sandalwood/30 bg-surface-bright sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
        <h1 class="text-2xl font-headline-md text-primary font-bold">Kalady Kshethram Admin</h1>
      </div>
      <a href="../index.html" class="font-label-md text-xs uppercase tracking-wider text-secondary hover:text-primary transition-colors flex items-center gap-1 bg-secondary/10 px-4 py-2 rounded-full border border-secondary/20">
        <span class="material-symbols-outlined text-[16px]">home</span> Back to Site
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div id="status-message"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- LEFT COLUMN: FORM -->
      <div class="lg:col-span-7">
        <div class="bg-surface-bright border border-sandalwood/30 p-8 rounded-2xl shadow-sm relative overflow-hidden">
          <!-- Decorative Top Bar -->
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-sandalwood"></div>

          <div class="flex justify-between items-end border-b border-sandalwood/30 pb-4 mb-6">
            <h2 id="form-title" class="text-2xl font-headline-md text-primary font-semibold">Add New Announcement</h2>
            <button type="button" id="cancel-edit-btn" class="hidden font-label-md text-xs uppercase tracking-wider text-red-600 hover:text-red-800 flex items-center gap-1 bg-red-50 px-3 py-1.5 rounded border border-red-200">
              <span class="material-symbols-outlined text-[14px]">close</span> Cancel Edit
            </button>
          </div>
          
          <form id="add-announcement-form" class="space-y-5">
            <div>
              <label class="block font-label-md text-sm text-on-surface-variant mb-1">Announcement Title *</label>
              <input type="text" id="title" required class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. Sri Dhakshinamurthy Homam">
            </div>

            <div>
              <label class="block font-label-md text-sm text-on-surface-variant mb-1">Description (What) *</label>
              <textarea id="description" required class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" rows="3" placeholder="Brief description of the event..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Badge</label>
                <input type="text" id="badge" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. Upcoming Pooja">
              </div>
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Full Date (Bottom bar)</label>
                <input type="text" id="fullDate" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. 18 February 2027">
              </div>
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Month (Abbrev)</label>
                <input type="text" id="dateMonth" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. Feb">
              </div>
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Calendar Day</label>
                <input type="number" id="dateDay" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. 18">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Time (When)</label>
                <input type="text" id="when" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. 7:00 AM to 12:00 PM">
              </div>
              <div>
                <label class="block font-label-md text-sm text-on-surface-variant mb-1">Location (Where)</label>
                <input type="text" id="where" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="e.g. Main Shrine">
              </div>
            </div>

            <div>
              <label class="block font-label-md text-sm text-on-surface-variant mb-1">Action Link (Optional)</label>
              <input type="url" id="link" class="w-full border border-sandalwood/40 bg-surface p-3 rounded text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="https://...">
            </div>

            <div class="pt-4">
              <button type="submit" id="submit-btn" class="w-full bg-primary hover:bg-primary-container text-white font-label-md text-sm uppercase tracking-widest py-3.5 px-6 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">publish</span> Publish Announcement
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- RIGHT COLUMN: LIVE FEED -->
      <div class="lg:col-span-5">
        <div class="bg-surface-bright/50 border border-sandalwood/20 p-6 rounded-2xl h-full flex flex-col">
          <div class="flex items-center justify-between border-b border-sandalwood/30 pb-4 mb-6">
            <h2 class="text-xl font-headline-md text-primary font-semibold flex items-center gap-2">
              <span class="material-symbols-outlined text-[20px]">feed</span> Live Feed
            </h2>
            <span class="font-label-md text-[10px] uppercase tracking-wider bg-green-100 text-green-800 px-2 py-1 rounded flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Syncing
            </span>
          </div>
          
          <div id="feed-container" class="flex flex-col gap-4 overflow-y-auto pr-2 hide-scrollbar flex-grow" style="max-height: calc(100vh - 200px);">
            <!-- Loading Skeleton -->
            <div class="animate-pulse flex flex-col gap-3 border border-sandalwood/30 bg-surface-bright p-5 rounded-xl">
              <div class="h-4 bg-sandalwood/20 rounded w-1/4"></div>
              <div class="h-6 bg-sandalwood/20 rounded w-3/4"></div>
              <div class="h-10 bg-sandalwood/20 rounded w-full"></div>
            </div>
            <div class="animate-pulse flex flex-col gap-3 border border-sandalwood/30 bg-surface-bright p-5 rounded-xl">
              <div class="h-4 bg-sandalwood/20 rounded w-1/4"></div>
              <div class="h-6 bg-sandalwood/20 rounded w-3/4"></div>
              <div class="h-10 bg-sandalwood/20 rounded w-full"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
