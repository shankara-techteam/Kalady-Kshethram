<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Kshethram</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/main.css">
  
  <style>
    /* Premium Admin Styles */
    :root {
      --sidebar-width: 280px;
    }
    body {
      background-color: #fcfbf9;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5b48d' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: 0 12px 40px rgba(87, 0, 0, 0.04);
    }
    .input-premium {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }
    .input-premium:focus {
      background: #ffffff;
      border-color: #791c12;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01), 0 0 0 3px rgba(121, 28, 18, 0.1);
      outline: none;
    }
    .card-hover {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(87, 0, 0, 0.08);
      border-color: rgba(197, 180, 141, 0.8);
    }
    .sidebar-item {
      transition: all 0.3s ease;
    }
    .sidebar-item.active {
      background: linear-gradient(90deg, rgba(197, 180, 141, 0.15) 0%, transparent 100%);
      border-left: 4px solid #c5b48d;
      color: #c5b48d;
      font-weight: 600;
    }
    .sidebar-item:not(.active):hover {
      background: rgba(255, 255, 255, 0.05);
      color: #c5b48d;
    }
    
    /* Login Overlay Animation */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }
    
    .view-transition {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    /* Custom Scrollbar for feeds */
    .feed-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .feed-scroll::-webkit-scrollbar-track {
      background: transparent; 
    }
    .feed-scroll::-webkit-scrollbar-thumb {
      background: rgba(197, 180, 141, 0.5); 
      border-radius: 10px;
    }
    .feed-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(197, 180, 141, 0.8); 
    }
  </style>
</head>

  <!-- JS LOGIC -->
  <script type="module">
    import { db, auth, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy, doc, updateDoc, deleteDoc, signInWithEmailAndPassword, signOut, onAuthStateChanged } from '../assets/js/firebase-config.js';

    // --- UI Elements ---
    const loginOverlay = document.getElementById('login-overlay');
    const dashboardLayout = document.getElementById('dashboard-layout');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const adminEmailDisplay = document.getElementById('admin-email-display');
    const statusToast = document.getElementById('status-toast');

    // --- Tabs Logic ---
    const tabs = document.querySelectorAll('.sidebar-item');
    const tabContents = document.querySelectorAll('.tab-content');
    const currentTabTitle = document.getElementById('current-tab-title');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Update active class on sidebar
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update Title
        currentTabTitle.textContent = tab.querySelector('span:nth-child(2)').textContent;
        
        // Show correct content
        const target = tab.getAttribute('data-tab');
        tabContents.forEach(tc => {
          if (tc.id === `tab-${target}`) {
            tc.classList.remove('hidden');
            tc.classList.add('animate-fade-in');
          } else {
            tc.classList.add('hidden');
            tc.classList.remove('animate-fade-in');
          }
        });
      });
    });

    // --- Toast Notification ---
    function showToast(message, type = 'success') {
      const isSuccess = type === 'success';
      const icon = isSuccess ? 'check_circle' : 'error';
      const bgClass = isSuccess ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800';
      const iconColor = isSuccess ? 'text-green-500' : 'text-red-500';

      statusToast.innerHTML = `<div class="${bgClass} border p-4 rounded-xl font-body-md flex items-center gap-3 shadow-lg"><span class="material-symbols-outlined text-[20px] ${iconColor}">${icon}</span> ${message}</div>`;
      
      statusToast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      statusToast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        statusToast.classList.remove('opacity-100', 'translate-y-0');
        statusToast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      }, 4000);
    }

    // --- Authentication Logic ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Logged in
        loginOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loginOverlay.classList.add('hidden'), 700); // Wait for fade out
        
        dashboardLayout.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        dashboardLayout.classList.add('opacity-100');
        
        adminEmailDisplay.textContent = user.email;
        
        // Initialize Data Listeners
        initAnnouncements();
        initEvents();
        initGallery();
      } else {
        // Not logged in
        loginOverlay.classList.remove('hidden');
        // Force reflow
        void loginOverlay.offsetWidth;
        loginOverlay.classList.remove('opacity-0', 'pointer-events-none');
        
        dashboardLayout.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      
      loginError.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Loading...`;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged handles the UI update
      } catch (error) {
        let msg = error.message || "Authentication failed.";
        if(error.code === 'auth/invalid-credential') msg = "Invalid email or password.";
        if(error.code === 'auth/too-many-requests') msg = "Too many attempts. Try again later.";
        loginError.textContent = msg;
        loginError.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">login</span> Authenticate`;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout Error", error);
      }
    });

    // --- Core CRUD Generator ---
    // A helper to generate forms and feeds for different collections to keep code DRY
    function setupCRUD(collectionName, formId, feedId, fields, renderCardFn) {
      const form = document.getElementById(formId);
      const feed = document.getElementById(feedId);
      const cancelBtn = document.getElementById(`cancel-edit-${collectionName.substring(0,3)}`);
      const formTitle = document.getElementById(`form-title-${collectionName.substring(0,3)}`);
      const submitBtn = document.getElementById(`btn-submit-${collectionName.substring(0,3)}`);
      const idInput = document.getElementById(`${collectionName.substring(0,3)}-id`);

      // Reset
      const resetForm = () => {
        form.reset();
        idInput.value = '';
        formTitle.textContent = `Add ${collectionName.charAt(0).toUpperCase() + collectionName.slice(1, -1)}`;
        cancelBtn.classList.add('hidden');
        if(collectionName === 'gallery') {
            document.getElementById('gal-preview').classList.add('hidden');
            document.getElementById('gal-preview-text').classList.remove('hidden');
        }
      };

      if(cancelBtn) cancelBtn.addEventListener('click', resetForm);

      // Listen to Firestore
      const q = query(collection(db, collectionName), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snapshot) => {
        feed.innerHTML = '';
        if (snapshot.empty) {
          feed.innerHTML = `<div class="p-8 text-center text-on-surface-variant opacity-70 border border-dashed border-sandalwood/50 rounded-2xl">No items found.</div>`;
          return;
        }

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const id = docSnap.id;
          const card = renderCardFn(id, data);
          
          // Attach Edit
          const editBtn = card.querySelector('.btn-edit');
          if (editBtn) {
            editBtn.addEventListener('click', () => {
              idInput.value = id;
              fields.forEach(f => {
                const el = document.getElementById(f.id);
                if (el) el.value = data[f.key] || '';
              });
              formTitle.textContent = `Edit ${collectionName.charAt(0).toUpperCase() + collectionName.slice(1, -1)}`;
              cancelBtn.classList.remove('hidden');
              
              if(collectionName === 'gallery' && data.url) {
                const img = document.getElementById('gal-preview');
                img.src = data.url;
                img.classList.remove('hidden');
                document.getElementById('gal-preview-text').classList.add('hidden');
              }
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          }

          // Attach Delete
          const delBtn = card.querySelector('.btn-delete');
          if (delBtn) {
            delBtn.addEventListener('click', async () => {
              if (confirm("Are you sure you want to delete this item?")) {
                try {
                  await deleteDoc(doc(db, collectionName, id));
                  if (idInput.value === id) resetForm();
                  showToast("Item deleted.");
                } catch (e) {
                  showToast(e.message, 'error');
                }
              }
            });
          }

          feed.appendChild(card);
        });
      });

      // Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {};
        fields.forEach(f => {
          const el = document.getElementById(f.id);
          if (el) data[f.key] = el.value;
        });

        submitBtn.disabled = true;
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">sync</span> Saving...`;

        try {
          if (idInput.value) {
            // Update
            await updateDoc(doc(db, collectionName, idInput.value), data);
            showToast("Item updated successfully.");
          } else {
            // Create
            data.createdAt = serverTimestamp();
            await addDoc(collection(db, collectionName), data);
            showToast("Item added successfully.");
          }
          resetForm();
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      });
    }

    // --- 1. Announcements ---
    function initAnnouncements() {
      setupCRUD('announcements', 'form-announcements', 'feed-announcements', [
        { id: 'ann-title', key: 'title' },
        { id: 'ann-desc', key: 'description' },
        { id: 'ann-badge', key: 'badge' },
        { id: 'ann-fulldate', key: 'fullDate' },
        { id: 'ann-when', key: 'when' },
        { id: 'ann-where', key: 'where' }
      ], (id, data) => {
        const div = document.createElement('div');
        div.className = "card-hover glass-panel p-5 rounded-2xl flex flex-col gap-3 border-l-4 border-l-primary relative overflow-hidden group";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="font-label-md text-[10px] tracking-[0.1em] text-secondary uppercase bg-secondary/10 px-2 py-0.5 rounded border border-secondary/20 mb-2 inline-block">${data.badge || 'Update'}</span>
              <h4 class="font-headline-md text-lg text-primary font-semibold">${data.title}</h4>
              <p class="font-body-md text-sm text-on-surface-variant mt-1 line-clamp-2">${data.description}</p>
            </div>
          </div>
          <div class="flex gap-2 mt-3 pt-3 border-t border-sandalwood/20">
            <button class="btn-edit font-label-md text-[10px] uppercase tracking-widest text-primary hover:bg-primary/10 px-3 py-1.5 rounded flex items-center gap-1 transition-colors"><span class="material-symbols-outlined text-[14px]">edit</span> Edit</button>
            <button class="btn-delete font-label-md text-[10px] uppercase tracking-widest text-red-600 hover:bg-red-50 px-3 py-1.5 rounded flex items-center gap-1 transition-colors"><span class="material-symbols-outlined text-[14px]">delete</span> Delete</button>
          </div>
        `;
        return div;
      });
    }

    // --- 2. Events ---
    function initEvents() {
      setupCRUD('events', 'form-events', 'feed-events', [
        { id: 'evt-title', key: 'title' },
        { id: 'evt-desc', key: 'description' },
        { id: 'evt-type', key: 'type' },
        { id: 'evt-date', key: 'date' },
        { id: 'evt-image', key: 'image_url' }
      ], (id, data) => {
        const div = document.createElement('div');
        div.className = "card-hover glass-panel p-4 rounded-2xl flex gap-4 border border-sandalwood/30 group items-center";
        const imgStr = data.image_url ? `<img src="${data.image_url}" class="w-24 h-24 object-cover rounded-xl shrink-0" onerror="this.src='../assets/images/om.jpg'">` : `<div class="w-24 h-24 bg-surface-container rounded-xl flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-sandalwood text-3xl">image</span></div>`;
        div.innerHTML = `
          ${imgStr}
          <div class="flex-1 min-w-0 py-1">
            <span class="font-label-md text-[9px] uppercase tracking-widest text-secondary">${data.type || 'Event'} • ${data.date || 'TBD'}</span>
            <h4 class="font-headline-md text-lg text-primary font-semibold truncate mt-0.5">${data.title}</h4>
            <p class="font-body-md text-xs text-on-surface-variant mt-1 line-clamp-2">${data.description}</p>
            <div class="flex gap-3 mt-3">
              <button class="btn-edit font-label-md text-[10px] uppercase tracking-widest text-primary hover:text-secondary transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">edit</span> Edit</button>
              <button class="btn-delete font-label-md text-[10px] uppercase tracking-widest text-red-600 hover:text-red-800 transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">delete</span> Delete</button>
            </div>
          </div>
        `;
        return div;
      });
    }

    // --- 3. Gallery ---
    function initGallery() {
      // Live image preview
      document.getElementById('gal-url').addEventListener('input', (e) => {
        const url = e.target.value;
        const img = document.getElementById('gal-preview');
        const text = document.getElementById('gal-preview-text');
        if(url) {
          img.src = url;
          img.classList.remove('hidden');
          text.classList.add('hidden');
        } else {
          img.classList.add('hidden');
          text.classList.remove('hidden');
        }
      });

      setupCRUD('gallery', 'form-gallery', 'feed-gallery', [
        { id: 'gal-title', key: 'title' },
        { id: 'gal-url', key: 'url' },
        { id: 'gal-category', key: 'category' }
      ], (id, data) => {
        const div = document.createElement('div');
        div.className = "card-hover glass-panel rounded-2xl border border-sandalwood/30 overflow-hidden group flex flex-col";
        div.innerHTML = `
          <div class="h-32 w-full overflow-hidden bg-black/5">
            <img src="${data.url}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='../assets/images/om.jpg'">
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="font-label-md text-[9px] uppercase tracking-widest text-secondary mb-1 block">${data.category || 'Media'}</span>
              <h4 class="font-headline-md text-sm text-primary font-semibold line-clamp-1">${data.title}</h4>
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-sandalwood/20">
              <button class="btn-edit text-primary hover:text-secondary transition-colors"><span class="material-symbols-outlined text-[18px]">edit</span></button>
              <button class="btn-delete text-red-600 hover:text-red-800 transition-colors"><span class="material-symbols-outlined text-[18px]">delete</span></button>
            </div>
          </div>
        `;
        return div;
      });
    }
  </script>
