<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Adi Shankara</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/main.css">
  
  <style>
    /* Premium subtle background texture */
    .premium-bg {
      background-color: #fcfbf9;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5b48d' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: 0 8px 32px rgba(87, 0, 0, 0.04);
    }

    .input-premium {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(197, 180, 141, 0.4);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }
    
    .input-premium:focus {
      background: #ffffff;
      border-color: #791c12;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01), 0 0 0 3px rgba(121, 28, 18, 0.1);
      outline: none;
    }

    .card-hover {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(87, 0, 0, 0.08);
      border-color: rgba(197, 180, 141, 0.8);
    }
  </style>

  <script type="module">
    import { db, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from '../assets/js/firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('add-announcement-form');
      const statusMessage = document.getElementById('status-message');
      const feedContainer = document.getElementById('feed-container');
      const formTitle = document.getElementById('form-title');
      const submitBtn = document.getElementById('submit-btn');
      const cancelEditBtn = document.getElementById('cancel-edit-btn');
      
      let currentEditId = null;

      // Realtime Feed
      const q = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'));
      
      onSnapshot(q, (snapshot) => {
        feedContainer.innerHTML = '';
        if (snapshot.empty) {
          feedContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center p-12 text-center opacity-70">
              <span class="material-symbols-outlined text-4xl text-sandalwood mb-3">inbox</span>
              <p class="font-headline-md text-lg text-primary">No announcements found</p>
              <p class="font-body-md text-sm text-on-surface-variant mt-1">Publish your first update using the form on the left.</p>
            </div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          
          const card = document.createElement('div');
          card.className = "card-hover glass-panel p-5 rounded-2xl flex flex-col gap-3 relative overflow-hidden group cursor-default";
          
          card.innerHTML = `
            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-primary to-secondary opacity-80"></div>
            <div class="flex justify-between items-start pl-3">
              <div>
                <span class="font-label-md text-[10px] tracking-[0.15em] text-secondary uppercase bg-secondary/10 px-2.5 py-1 rounded-md border border-secondary/20 inline-block mb-2 font-bold">${data.badge || 'Update'}</span>
                <h3 class="font-headline-md text-xl text-primary leading-tight font-semibold group-hover:text-primary-container transition-colors">${data.title}</h3>
                <p class="font-body-md text-on-surface-variant text-sm mt-2 line-clamp-2 leading-relaxed opacity-90">${data.description}</p>
                <div class="flex items-center gap-4 mt-3">
                  <p class="font-label-md text-xs text-secondary flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">calendar_today</span> ${data.fullDate || 'No date set'}</p>
                  ${data.where ? `<p class="font-label-md text-xs text-secondary flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">location_on</span> ${data.where}</p>` : ''}
                </div>
              </div>
            </div>
            <div class="flex gap-2 mt-3 pt-4 border-t border-sandalwood/20 pl-3">
              <button class="edit-btn font-label-md text-xs uppercase tracking-widest text-primary hover:text-secondary transition-colors flex items-center gap-1.5 bg-primary/5 hover:bg-primary/10 px-3 py-1.5 rounded-lg border border-transparent hover:border-primary/20" data-id="${id}">
                <span class="material-symbols-outlined text-[14px]">edit</span> Edit
              </button>
              <button class="delete-btn font-label-md text-xs uppercase tracking-widest text-red-600 hover:text-red-800 transition-colors flex items-center gap-1.5 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-transparent hover:border-red-200 ml-2" data-id="${id}">
                <span class="material-symbols-outlined text-[14px]">delete</span> Delete
              </button>
            </div>
          `;
          
          feedContainer.appendChild(card);
          
          // Attach listeners
          card.querySelector('.edit-btn').addEventListener('click', () => {
            currentEditId = id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('badge').value = data.badge || '';
            document.getElementById('dateMonth').value = data.dateMonth || '';
            document.getElementById('dateDay').value = data.dateDay || '';
            document.getElementById('description').value = data.description || '';
            document.getElementById('fullDate').value = data.fullDate || '';
            document.getElementById('when').value = data.when || '';
            document.getElementById('where').value = data.where || '';
            document.getElementById('link').value = data.link || '';
            
            formTitle.textContent = "Edit Announcement";
            submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">update</span> Update Announcement`;
            
            // Highlight the submit button to indicate edit mode
            submitBtn.classList.remove('from-primary', 'to-primary-container');
            submitBtn.classList.add('from-secondary', 'to-secondary-container');

            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          
          card.querySelector('.delete-btn').addEventListener('click', async () => {
            if (confirm("Are you sure you want to delete this announcement? This action cannot be undone.")) {
              try {
                await deleteDoc(doc(db, "announcements", id));
                if (currentEditId === id) resetForm();
              } catch (error) {
                alert("Error deleting: " + error.message);
              }
            }
          });
        });
      });

      function resetForm() {
        currentEditId = null;
        form.reset();
        formTitle.textContent = "Add New Announcement";
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">publish</span> Publish Announcement`;
        
        // Reset button colors
        submitBtn.classList.add('from-primary', 'to-primary-container');
        submitBtn.classList.remove('from-secondary', 'to-secondary-container');
        
        cancelEditBtn.classList.add('hidden');
      }

      cancelEditBtn.addEventListener('click', resetForm);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const announcementData = {
          title: document.getElementById('title').value,
          badge: document.getElementById('badge').value || 'Update',
          dateMonth: document.getElementById('dateMonth').value || 'N/A',
          dateDay: document.getElementById('dateDay').value || 'N/A',
          description: document.getElementById('description').value,
          fullDate: document.getElementById('fullDate').value || '',
          when: document.getElementById('when').value || '',
          where: document.getElementById('where').value || '',
          link: document.getElementById('link').value || '',
        };

        // Disable button during submit
        const originalBtnContent = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Processing...`;

        try {
          if (currentEditId) {
            // Update
            await updateDoc(doc(db, "announcements", currentEditId), announcementData);
            showStatus('success', 'Announcement updated successfully!');
          } else {
            // Create
            announcementData.createdAt = serverTimestamp();
            await addDoc(collection(db, "announcements"), announcementData);
            showStatus('success', 'Announcement published successfully!');
          }
          resetForm();
        } catch (error) {
          showStatus('error', `Error: ${error.message}`);
        } finally {
          submitBtn.disabled = false;
          if(!currentEditId) {
            submitBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">publish</span> Publish Announcement`;
          }
        }
      });

      function showStatus(type, message) {
        if (type === 'success') {
          statusMessage.innerHTML = `<div class="bg-green-50 border border-green-200 text-green-800 p-4 rounded-xl font-body-md mb-6 flex items-center gap-3 shadow-sm transform transition-all animate-fade-in"><span class="material-symbols-outlined text-[20px] text-green-500">check_circle</span> ${message}</div>`;
        } else {
          statusMessage.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-xl font-body-md mb-6 flex items-center gap-3 shadow-sm transform transition-all animate-fade-in"><span class="material-symbols-outlined text-[20px] text-red-500">error</span> ${message}</div>`;
        }
        setTimeout(() => { statusMessage.innerHTML = ''; }, 5000);
      }
    });
  </script>
</head>
<body class="premium-bg text-on-surface min-h-screen relative selection:bg-secondary/20 selection:text-primary">
  
  <header class="border-b border-sandalwood/30 bg-surface-bright/80 backdrop-blur-md sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3 group cursor-pointer">
        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20 group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-primary">admin_panel_settings</span>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-headline-md text-primary font-bold leading-none tracking-tight">Kshethram Admin</h1>
          <p class="font-label-md text-[10px] uppercase tracking-[0.2em] text-secondary mt-1">Management Portal</p>
        </div>
      </div>
      <a href="../index.html" class="font-label-md text-xs uppercase tracking-wider text-secondary hover:text-primary transition-all duration-300 flex items-center gap-1.5 bg-white px-4 py-2.5 rounded-full border border-sandalwood/40 shadow-sm hover:shadow-md hover:-translate-y-0.5">
        <span class="material-symbols-outlined text-[16px]">home</span> <span class="hidden sm:inline">Back to Site</span>
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12 relative z-10">
    <div id="status-message"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-start">
      
      <!-- LEFT COLUMN: FORM -->
      <div class="lg:col-span-6 xl:col-span-5 sticky top-28">
        <div class="glass-panel p-6 md:p-8 rounded-3xl relative overflow-hidden">
          <!-- Decorative Top Bar -->
          <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>

          <div class="flex justify-between items-center border-b border-sandalwood/30 pb-5 mb-6">
            <h2 id="form-title" class="text-2xl font-headline-md text-primary font-bold tracking-tight">Add Announcement</h2>
            <button type="button" id="cancel-edit-btn" class="hidden font-label-md text-[10px] uppercase tracking-widest text-red-600 hover:text-red-800 flex items-center gap-1 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-full border border-red-200 transition-colors">
              <span class="material-symbols-outlined text-[14px]">close</span> Cancel
            </button>
          </div>
          
          <form id="add-announcement-form" class="space-y-5">
            <div>
              <label class="block font-label-md text-xs uppercase tracking-wider text-primary mb-1.5 font-bold">Title *</label>
              <input type="text" id="title" required class="w-full input-premium p-3 rounded-xl text-sm font-body-md" placeholder="e.g. Sri Dhakshinamurthy Homam">
            </div>

            <div>
              <label class="block font-label-md text-xs uppercase tracking-wider text-primary mb-1.5 font-bold">Description *</label>
              <textarea id="description" required class="w-full input-premium p-3 rounded-xl text-sm font-body-md resize-none" rows="3" placeholder="Brief description of the event..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Badge</label>
                <input type="text" id="badge" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. Upcoming">
              </div>
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Full Date</label>
                <input type="text" id="fullDate" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. 18 February 2027">
              </div>
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Cal Month</label>
                <input type="text" id="dateMonth" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. Feb">
              </div>
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Cal Day</label>
                <input type="number" id="dateDay" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. 18">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Time</label>
                <input type="text" id="when" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. 7:00 AM">
              </div>
              <div>
                <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Location</label>
                <input type="text" id="where" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="e.g. Main Shrine">
              </div>
            </div>

            <div>
              <label class="block font-label-md text-[10px] uppercase tracking-wider text-secondary mb-1.5 font-bold">Action Link (Optional)</label>
              <input type="url" id="link" class="w-full input-premium p-2.5 rounded-lg text-sm font-body-md" placeholder="https://...">
            </div>

            <div class="pt-6">
              <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-primary to-primary-container hover:from-primary-container hover:to-primary text-white font-label-md text-sm uppercase tracking-widest py-4 px-6 rounded-xl transition-all duration-300 shadow-[0_8px_20px_rgba(87,0,0,0.25)] hover:shadow-[0_12px_25px_rgba(87,0,0,0.35)] hover:-translate-y-0.5 flex items-center justify-center gap-2 font-bold disabled:opacity-70 disabled:cursor-not-allowed">
                <span class="material-symbols-outlined text-[18px]">publish</span> Publish Announcement
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- RIGHT COLUMN: LIVE FEED -->
      <div class="lg:col-span-6 xl:col-span-7 mt-8 lg:mt-0">
        <div class="flex items-center justify-between border-b border-sandalwood/30 pb-4 mb-6 sticky top-28 bg-[#fcfbf9]/90 backdrop-blur-sm z-10 py-2">
          <div>
            <h2 class="text-2xl font-headline-md text-primary font-bold tracking-tight">Live Feed</h2>
            <p class="font-body-md text-sm text-on-surface-variant mt-0.5">Real-time database sync</p>
          </div>
          <span class="font-label-md text-[10px] uppercase tracking-[0.2em] bg-green-100/80 border border-green-200 text-green-800 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Active
          </span>
        </div>
        
        <div id="feed-container" class="flex flex-col gap-5 pb-12">
          <!-- Loading Skeleton -->
          <div class="animate-pulse glass-panel p-6 rounded-2xl flex flex-col gap-4">
            <div class="h-4 bg-sandalwood/30 rounded w-20"></div>
            <div class="h-8 bg-sandalwood/20 rounded w-3/4"></div>
            <div class="h-16 bg-sandalwood/10 rounded w-full"></div>
            <div class="flex gap-4 mt-2">
              <div class="h-8 bg-sandalwood/20 rounded w-20"></div>
              <div class="h-8 bg-sandalwood/20 rounded w-20"></div>
            </div>
          </div>
          <div class="animate-pulse glass-panel p-6 rounded-2xl flex flex-col gap-4">
            <div class="h-4 bg-sandalwood/30 rounded w-20"></div>
            <div class="h-8 bg-sandalwood/20 rounded w-1/2"></div>
            <div class="h-16 bg-sandalwood/10 rounded w-full"></div>
            <div class="flex gap-4 mt-2">
              <div class="h-8 bg-sandalwood/20 rounded w-20"></div>
              <div class="h-8 bg-sandalwood/20 rounded w-20"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
